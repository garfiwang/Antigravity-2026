<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>來賓現場簽到 — AI 照護大健康講座</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --secondary: #06b6d4;
      --accent-green: #10b981;
      --bg-gradient: linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 100%);
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --shadow-lg: 0 20px 40px rgba(2, 132, 199, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Noto Sans TC', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
    }

    .checkin-container {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.8);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: #ffffff;
      position: relative;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(6px);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .title {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 14px;
      color: #e0f2fe;
      font-weight: 500;
    }

    /* Form Body */
    .form-body {
      padding: 28px 24px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-label {
      display: block;
      font-size: 16px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 10px;
    }

    .req {
      color: #e11d48;
      margin-left: 2px;
    }

    .form-control {
      width: 100%;
      height: 56px;
      border: 2px solid var(--border-color);
      border-radius: 14px;
      padding: 0 18px;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
      background: #f8fafc;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .form-control:focus {
      background: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
    }

    .form-control::placeholder {
      color: #94a3b8;
      font-weight: 400;
      font-size: 16px;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      height: 54px;
      background: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.3);
      transition: all 0.2s ease;
      letter-spacing: 1px;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(2, 132, 199, 0.4);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn-submit:disabled {
      opacity: 0.75;
      cursor: not-allowed;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s ease-in-out infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Success Card View */
    .success-view {
      display: none;
      padding: 32px 24px;
      text-align: center;
      animation: fadeIn 0.35s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .success-icon {
      width: 72px;
      height: 72px;
      background: #dcfce7;
      color: #16a34a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      margin: 0 auto 18px;
      box-shadow: 0 8px 20px rgba(22, 163, 74, 0.15);
    }

    .success-title {
      font-size: 24px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .success-desc {
      font-size: 15px;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .info-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 18px;
      text-align: left;
      margin-bottom: 22px;
      font-size: 14px;
      line-height: 1.8;
      color: #334155;
    }

    .guest-name-highlight {
      font-size: 18px;
      font-weight: 800;
      color: #0284c7;
    }

    .welcome-tips {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      color: #166534;
      margin-top: 10px;
      line-height: 1.6;
    }

    .btn-reset {
      width: 100%;
      height: 48px;
      background: #f1f5f9;
      color: #475569;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-reset:hover {
      background: #e2e8f0;
      color: #1e293b;
    }

    .footer {
      text-align: center;
      padding-top: 14px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="checkin-container">
    <div class="card">
      
      <!-- Top Banner -->
      <div class="header">
        <div class="badge">現場報到處</div>
        <h1 class="title">AI 照護大健康講座</h1>
        <p class="subtitle">來賓現場簽到表</p>
      </div>

      <!-- Check-in Form View -->
      <div class="form-body" id="formView">
        <form id="checkInForm" onsubmit="handleCheckIn(event)">
          <div class="form-group">
            <label class="form-label" for="guestName">你的大名<span class="req">*</span></label>
            <input 
              type="text" 
              id="guestName" 
              name="guestName" 
              class="form-control" 
              placeholder="請輸入您的大名" 
              required 
              autocomplete="name"
              autofocus
            >
          </div>

          <button type="submit" id="submitBtn" class="btn-submit">
            <div class="spinner" id="btnSpinner"></div>
            <span id="btnText">送出簽到</span>
          </button>
        </form>

        <div class="footer">
          敦化北路168號1樓體驗館
        </div>
      </div>

      <!-- Success View (After Check-in) -->
      <div class="success-view" id="successView">
        <div class="success-icon">✓</div>
        <h2 class="success-title">報到成功！</h2>
        <p class="success-desc">歡迎蒞臨 AI 照護大健康講座，祝您有美好充實的下午！</p>

        <div class="info-card">
          <div>👤 來賓大名：<span class="guest-name-highlight" id="displayGuestName"></span></div>
          <div>⏱️ 簽到時間：<strong id="displayCheckInTime" style="color:#0f172a;"></strong></div>
          <div>📍 活動地點：敦化北路168號1樓體驗館</div>
          
          <div class="welcome-tips">
            ✨ <strong>現場引導小叮嚀：</strong><br>
            • 請先至體驗區進行<strong>現場健康檢測</strong><br>
            • 現場備有<strong>精緻下午茶與咖啡</strong>，請自由享用
          </div>
        </div>

        <button type="button" onclick="resetForm()" class="btn-reset">
          ➕ 替同行友人簽到
        </button>
      </div>

    </div>
  </div>

  <script>
    function handleCheckIn(e) {
      e.preventDefault();

      var nameInput = document.getElementById('guestName');
      var name = nameInput.value.trim();

      if (!name) {
        alert('請輸入您的大名！');
        nameInput.focus();
        return;
      }

      var submitBtn = document.getElementById('submitBtn');
      var btnSpinner = document.getElementById('btnSpinner');
      var btnText = document.getElementById('btnText');

      submitBtn.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnText.innerText = '簽到處理中...';

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(response) {
            submitBtn.disabled = false;
            btnSpinner.style.display = 'none';
            btnText.innerText = '送出簽到';

            if (response && response.success) {
              showSuccess(response.data);
            } else {
              alert('簽到失敗：' + (response ? response.message : '未知錯誤'));
            }
          })
          .withFailureHandler(function(error) {
            submitBtn.disabled = false;
            btnSpinner.style.display = 'none';
            btnText.innerText = '送出簽到';
            alert('系統連線異常：' + error.message);
          })
          .submitCheckIn(name);
      } else {
        // 本地預覽測試
        setTimeout(function() {
          submitBtn.disabled = false;
          btnSpinner.style.display = 'none';
          btnText.innerText = '送出簽到';
          showSuccess({
            guestName: name,
            checkInTime: new Date().toLocaleTimeString('zh-TW', { hour12: false })
          });
        }, 800);
      }
    }

    function showSuccess(data) {
      document.getElementById('displayGuestName').innerText = data.guestName || '';
      document.getElementById('displayCheckInTime').innerText = data.checkInTime || '';
      document.getElementById('formView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
    }

    function resetForm() {
      document.getElementById('guestName').value = '';
      document.getElementById('formView').style.display = 'block';
      document.getElementById('successView').style.display = 'none';
      document.getElementById('guestName').focus();
    }
  </script>
</body>
</html>
